<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMILYA — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f5f2;
  color:#222;
}

header{
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:18px 20px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:700;
  letter-spacing:3px;
}

.header-right{
  display:flex;
  gap:10px;
  align-items:center;
}

button{
  border:0;
  cursor:pointer;
}

.logout{
  background:#222;
  color:#fff;
  padding:10px 16px;
  border-radius:8px;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 20px;
}

h1{
  margin-bottom:25px;
  font-weight:500;
}

.login-box,
.form-box,
.product{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:22px;
}

.login-box{
  max-width:450px;
  margin:80px auto;
}

input,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  margin-top:7px;
  margin-bottom:15px;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

label{
  font-size:14px;
  font-weight:600;
}

.primary{
  width:100%;
  padding:13px;
  border-radius:8px;
  background:#222;
  color:#fff;
  font-weight:700;
  font-size:15px;
}

.message{
  margin-top:15px;
  color:#b00020;
  font-size:14px;
}

.form-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.form-title h2{
  margin:0;
  font-size:22px;
  font-weight:500;
}

.cancel{
  background:#eee;
  padding:9px 14px;
  border-radius:7px;
}

.products{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.product{
  display:flex;
  gap:18px;
}

.product img{
  width:130px;
  height:130px;
  object-fit:cover;
  border-radius:9px;
  background:#eee;
}

.product-info{
  flex:1;
}

.product-name{
  font-size:18px;
  font-weight:700;
  margin-bottom:7px;
}

.product-price{
  font-size:18px;
  font-weight:700;
  margin:8px 0;
}

.category{
  font-size:12px;
  color:#8f6d4d;
  font-weight:700;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.edit{
  background:#222;
  color:#fff;
  padding:8px 13px;
  border-radius:7px;
}

.delete{
  background:#eee;
  color:#b00020;
  padding:8px 13px;
  border-radius:7px;
}

.add{
  background:#222;
  color:#fff;
  padding:12px 18px;
  border-radius:8px;
  font-weight:700;
}

.hidden{
  display:none;
}

@media(max-width:700px){
  .products{
    grid-template-columns:1fr;
  }

  .product{
    flex-direction:column;
  }

  .product img{
    width:100%;
    height:220px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">SIMILYA ADMIN</div>

    <div class="header-right">
      <button class="add" onclick="showForm()">
        + Ajouter produit
      </button>

      <button class="logout" onclick="logout()">
        Déconnexion
      </button>
    </div>

  </div>
</header>


<!-- LOGIN -->

<div id="loginPage" class="container">

  <div class="login-box">

    <h1>Connexion Admin</h1>

    <label>Email</label>
    <input
      id="loginEmail"
      type="email"
      placeholder="Votre email"
    >

    <label>Mot de passe</label>
    <input
      id="loginPassword"
      type="password"
      placeholder="Votre mot de passe"
    >

    <button
      class="primary"
      onclick="login()"
    >
      Se connecter
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

</div>


<!-- ADMIN -->

<div id="adminPage" class="container hidden">

  <div id="formBox" class="form-box hidden">

    <div class="form-title">

      <h2 id="formTitle">
        Ajouter un produit
      </h2>

      <button
        class="cancel"
        onclick="hideForm()"
      >
        Annuler
      </button>

    </div>


    <input id="productId" type="hidden">


    <label>Nom du produit</label>
    <input
      id="name"
      type="text"
      placeholder="Ex: Crème solaire SPF 50+"
    >


    <label>Prix (DH)</label>
    <input
      id="price"
      type="number"
      step="0.01"
      placeholder="190"
    >


    <label>Catégorie</label>
    <input
      id="category"
      type="text"
      placeholder="SOLAIRE"
    >


    <label>Volume / taille</label>
    <input
      id="size"
      type="text"
      placeholder="50 ml"
    >


    <label>URL de l'image</label>
    <input
      id="imageUrl"
      type="url"
      placeholder="https://..."
    >


    <label>
      Avantages — un avantage par ligne
    </label>

    <textarea
      id="benefits"
      placeholder="Protection UV large spectre&#10;Hydrate la peau&#10;Prévient le vieillissement"
    ></textarea>


    <button
      class="primary"
      onclick="saveProduct()"
    >
      Enregistrer
    </button>

    <div id="formMessage" class="message"></div>

  </div>


  <div class="form-title" style="margin-top:30px">

    <h1>Produits</h1>

  </div>


  <div id="products" class="products">
    Chargement...
  </div>

</div>


<script>

const SUPABASE_URL =
  "https://kjrgjmcjpkoxnnccanip.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_aHnsiRvjTjfOlVYfd6vS3w_VqFL0gKd";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function checkSession(){

  const {
    data:{
      session
    }
  } = await supabaseClient.auth.getSession();

  if(session){
    showAdmin();
  }else{
    showLogin();
  }
}


function showLogin(){

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("adminPage")
    .classList.add("hidden");
}


function showAdmin(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("adminPage")
    .classList.remove("hidden");

  loadProducts();
}


async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "";

  if(!email || !password){

    message.textContent =
      "Veuillez remplir les deux champs.";

    return;
  }

  const {
    error
  } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){

    message.textContent =
      "Email ou mot de passe incorrect.";

    console.error(error);

    return;
  }

  showAdmin();
}


async function logout(){

  await supabaseClient.auth.signOut();

  showLogin();
}


function showForm(product=null){

  document
    .getElementById("formBox")
    .classList.remove("hidden");

  document
    .getElementById("formMessage")
    .textContent = "";

  if(product){

    document.getElementById("formTitle")
      .textContent = "Modifier le produit";

    document.getElementById("productId")
      .value = product.id;

    document.getElementById("name")
      .value = product.name || "";

    document.getElementById("price")
      .value = product.price || "";

    document.getElementById("category")
      .value = product.category || "";

    document.getElementById("size")
      .value = product.size || "";

    document.getElementById("imageUrl")
      .value = product.image_url || "";

    document.getElementById("benefits")
      .value =
      Array.isArray(product.benefits)
        ? product.benefits.join("\n")
        : "";

  }else{

    document.getElementById("formTitle")
      .textContent = "Ajouter un produit";

    document.getElementById("productId")
      .value = "";

    document.getElementById("name")
      .value = "";

    document.getElementById("price")
      .value = "";

    document.getElementById("category")
      .value = "";

    document.getElementById("size")
      .value = "";

    document.getElementById("imageUrl")
      .value = "";

    document.getElementById("benefits")
      .value = "";
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


function hideForm(){

  document
    .getElementById("formBox")
    .classList.add("hidden");
}


async function saveProduct(){

  const message =
    document.getElementById("formMessage");

  message.textContent = "";

  const id =
    document.getElementById("productId").value;

  const name =
    document.getElementById("name").value.trim();

  const price =
    Number(document.getElementById("price").value);

  const category =
    document.getElementById("category").value.trim();

  const size =
    document.getElementById("size").value.trim();

  const image_url =
    document.getElementById("imageUrl").value.trim();

  const benefits =
    document.getElementById("benefits")
      .value
      .split("\n")
      .map(x => x.trim())
      .filter(Boolean);


  if(!name || !price){

    message.textContent =
      "Le nom et le prix sont obligatoires.";

    return;
  }


  const product = {
    name,
    price,
    category,
    size,
    image_url,
    benefits,
    active:true
  };


  let result;


  if(id){

    result =
      await supabaseClient
        .from("products")
        .update(product)
        .eq("id", id);

  }else{

    result =
      await supabaseClient
        .from("products")
        .insert(product);
  }


  if(result.error){

    console.error(result.error);

    message.textContent =
      "Erreur : " + result.error.message;

    return;
  }


  hideForm();

  loadProducts();
}


async function loadProducts(){

  const container =
    document.getElementById("products");

  container.innerHTML =
    "Chargement...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("id", {
        ascending:true
      });


  if(error){

    container.innerHTML =
      "<p>Erreur de chargement.</p>";

    console.error(error);

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML =
      "<p>Aucun produit.</p>";

    return;
  }


  container.innerHTML = "";


  data.forEach(product => {

    const card =
      document.createElement("div");

    card.className = "product";


    const benefits =
      Array.isArray(product.benefits)
        ? product.benefits.join(" • ")
        : "";


    card.innerHTML = `

      <img
        src="${escapeHTML(product.image_url || "")}"
        alt="${escapeHTML(product.name)}"
      >

      <div class="product-info">

        <div class="category">
          ${escapeHTML(product.category || "")}
        </div>

        <div class="product-name">
          ${escapeHTML(product.name)}
        </div>

        <div>
          ${escapeHTML(product.size || "")}
        </div>

        <div class="product-price">
          ${Number(product.price).toLocaleString("fr-FR")} DH
        </div>

        <div style="font-size:13px;color:#777">
          ${escapeHTML(benefits)}
        </div>

        <div class="actions">

          <button
            class="edit"
            onclick='editProduct(${JSON.stringify(product)})'
          >
            Modifier
          </button>

          <button
            class="delete"
            onclick="deleteProduct(${product.id})"
          >
            Supprimer
          </button>

        </div>

      </div>
    `;


    container.appendChild(card);

  });
}


function editProduct(product){

  showForm(product);
}


async function deleteProduct(id){

  if(!confirm(
    "Voulez-vous vraiment supprimer ce produit ?"
  )){
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);


  if(error){

    alert(
      "Erreur : " + error.message
    );

    console.error(error);

    return;
  }


  loadProducts();
}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


checkSession();

</script>

</body>
</html>
